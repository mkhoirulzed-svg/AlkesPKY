<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detail Produk | Alkes PKY</title>

<link rel="icon" type="image/png" href="./logo.png">
<link rel="apple-touch-icon" href="./logo.png">
<meta name="theme-color" content="#0f766e">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#0f766e;
  --primary-dark:#115e59;
  --wa:#22c55e;
  --ig:#d62976;
  --shop:#ee4d2d;
  --bg:#f0fdfa;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
}

@font-face{
  font-family:'Archicoco';
  src:url('./Archicoco.otf') format('truetype');
}

*{
  box-sizing:border-box;
  font-family:Inter,sans-serif;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top, #ccfbf1 0, transparent 330px),
    var(--bg);
  color:var(--text);
}

.container{
  width:100%;
  max-width:1180px;
  margin:0 auto;
  padding:18px;
}

.card{
  background:rgba(255,255,255,.94);
  border:1px solid rgba(15,118,110,.08);
  border-radius:24px;
  padding:22px;
  box-shadow:0 18px 45px rgba(15,118,110,.10);
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  flex-wrap:wrap;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:78px;
  height:78px;
  object-fit:contain;
}

.brand h1{
  margin:0;
  font-family:'Archicoco';
  color:#4daced;
  font-size:30px;
  line-height:1;
}

.motto{
  margin-top:5px;
  font-size:14px;
  color:var(--muted);
}

.social-links{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.social-btn{
  min-width:100px;
  padding:11px 14px;
  border-radius:999px;
  color:#fff;
  text-decoration:none;
  font-size:13px;
  font-weight:800;
  text-align:center;
  box-shadow:0 8px 18px rgba(0,0,0,.10);
}

.social-wa{background:var(--wa);}
.ig{background:var(--ig);}
.shop{background:var(--shop);}

.detail-layout{
  display:grid;
  grid-template-columns:1fr 1.1fr;
  gap:26px;
  margin-top:24px;
  align-items:start;
}

.product-img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:22px;
  background:#f3f4f6;
  box-shadow:0 10px 24px rgba(0,0,0,.08);
}

.detail-info h2{
  margin:0;
  font-size:30px;
  line-height:1.25;
}

.price{
  font-size:24px;
  color:var(--primary);
  font-weight:900;
  margin-top:10px;
}

.status{
  display:inline-block;
  margin-top:12px;
  padding:8px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:800;
}

.tersedia{
  background:#dcfce7;
  color:#166534;
}

.habis{
  background:#fee2e2;
  color:#991b1b;
}

.desc{
  font-size:15px;
  color:#374151;
  margin-top:16px;
  line-height:1.65;
  white-space:pre-line;
}

.btn{
  display:block;
  margin-top:10px;
  padding:13px;
  border-radius:14px;
  text-align:center;
  font-weight:800;
  text-decoration:none;
}

.wa{
  background:var(--wa);
  color:#fff;
}

.home{
  background:#e5e7eb;
  color:#0f766e;
}

.share-title{
  margin-top:22px;
  font-size:14px;
  font-weight:800;
}

.share-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:10px;
}

.share-btn{
  padding:11px 8px;
  border-radius:14px;
  color:#fff;
  font-size:12px;
  font-weight:800;
  text-align:center;
  text-decoration:none;
  cursor:pointer;
  border:none;
}

.share-wa{background:#22c55e;}
.share-fb{background:#1877f2;}
.share-ig{background:#d62976;}

.section-title{
  margin:32px 0 14px;
  font-size:22px;
  font-weight:900;
}

.products{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:16px;
}

.product{
  background:#fff;
  border:1px solid rgba(0,0,0,.06);
  border-radius:18px;
  padding:12px;
  box-shadow:0 8px 22px rgba(0,0,0,.06);
  display:flex;
  flex-direction:column;
}

.product img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:14px;
  background:#f3f4f6;
}

.product .name{
  font-size:14px;
  font-weight:800;
  margin-top:10px;
  line-height:1.35;
}

.product .price{
  font-size:15px;
  color:var(--primary);
  font-weight:900;
  margin-top:5px;
}

.ask{
  display:block;
  margin-top:auto;
  padding:10px;
  background:var(--primary);
  color:#fff;
  border-radius:12px;
  text-align:center;
  font-size:12px;
  font-weight:800;
  text-decoration:none;
}

footer{
  text-align:center;
  font-size:12px;
  margin-top:18px;
  color:#6b7280;
}

@media(max-width:900px){
  .container{
    max-width:760px;
  }

  .header{
    justify-content:center;
    text-align:center;
  }

  .brand{
    justify-content:center;
  }

  .social-links{
    justify-content:center;
    width:100%;
  }

  .detail-layout{
    grid-template-columns:1fr;
  }

  .products{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:600px){
  .container{
    padding:12px;
  }

  .card{
    border-radius:20px;
    padding:16px;
  }

  .header{
    display:block;
    text-align:center;
  }

  .brand{
    display:block;
  }

  .logo{
    width:105px;
    height:auto;
    margin-bottom:8px;
  }

  .brand h1{
    font-size:25px;
  }

  .social-links{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:16px;
  }

  .social-btn{
    min-width:0;
    padding:11px 6px;
    font-size:12px;
  }

  .detail-info h2{
    font-size:22px;
  }

  .price{
    font-size:20px;
  }

  .desc{
    font-size:14px;
  }

  .share-buttons{
    grid-template-columns:repeat(3,1fr);
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .product{
    padding:10px;
  }

  .product .name{
    font-size:13px;
  }
}

@media(max-width:360px){
  .products{
    grid-template-columns:1fr;
  }

  .share-buttons{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <div class="header">
      <div class="brand">
        <img src="./logo.png" class="logo">
        <div>
          <h1>Alkes PKY</h1>
          <div class="motto">Sahabat Kesehatan Anda</div>
        </div>
      </div>

      <div class="social-links">
        <a href="https://wa.me/6282253124745" class="social-btn social-wa">WhatsApp</a>
        <a href="https://www.instagram.com/alkes_pky/" class="social-btn ig">Instagram</a>
        <a href="https://shopee.co.id/muhammadkhoirulzed" class="social-btn shop">Shopee</a>
      </div>
    </div>

    <div id="detailCard">
      <p style="text-align:center;color:#6b7280;margin-top:24px">
        Memuat detail produk...
      </p>
    </div>

    <div class="section-title">Produk Serupa</div>
    <div class="products" id="relatedProducts"></div>

  </div>

  <footer>© 2025 Alkes PKY</footer>
</div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbz3XTARB3Vd1pANXA5MZ1KqbquHLRC4eO3K6uZENRxfjtvnE1Nb7gv0AHEkxqDxyejGtA/exec?action=produk_web";

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const card = document.getElementById("detailCard");
const relatedBox = document.getElementById("relatedProducts");

let produkShopee = [];

function normalizeStatus(keterangan){

  const raw =
    String(keterangan || "")
    .toLowerCase()
    .trim();

  // PRIORITAS: TIDAK TERSEDIA
  if(
    raw.includes("tidak tersedia") ||
    raw.includes("habis") ||
    raw.includes("kosong") ||
    raw.includes("sold out")
  ){
    return {
      statusClass:"habis",
      statusText:"Tidak Tersedia"
    };
  }

  // PROSES RESTOK
  if(
    raw.includes("restok") ||
    raw.includes("pre order") ||
    raw.includes("po") ||
    raw.includes("proses")
  ){
    return {
      statusClass:"habis",
      statusText:"Proses Restok"
    };
  }

  // DEFAULT TERSEDIA
  return {
    statusClass:"tersedia",
    statusText:"Tersedia"
  };
}

function renderDetail(produk){
  const status = normalizeStatus(produk.keterangan);

  card.innerHTML = `
    <div class="detail-layout">
      <div>
        <img
          src="${produk.gambar || './logo.png'}"
          class="product-img"
          alt="${produk.nama || 'Produk Alkes PKY'}">
      </div>

      <div class="detail-info">
        <h2>${produk.nama || ""}</h2>

        <div class="price">${produk.harga || ""}</div>

        <div class="status ${status.statusClass}">
          ${status.statusText}
        </div>

        <div class="desc">
          ${produk.deskripsi || produk.keterangan || "Belum ada deskripsi produk."}
        </div>

        <div class="share-title">Bagikan Produk</div>

        <div class="share-buttons">
          <a class="share-btn share-wa" id="shareWA">WhatsApp</a>
          <a class="share-btn share-fb" id="shareFB">Facebook</a>
          <button class="share-btn share-ig" id="shareIG">Instagram</button>
        </div>

        <a class="btn wa"
          href="https://wa.me/6282253124745?text=Halo,%20saya%20ingin%20menanyakan%20produk%20${encodeURIComponent(produk.nama || "")}">
          Tanya via WhatsApp
        </a>

        <a class="btn home" href="index.html">
          ← Kembali ke Home
        </a>
      </div>
    </div>
  `;

  setupShare(produk);
}

function setupShare(produk){
  const urlProduk = window.location.href;
  const textProduk = `Cek produk ${produk.nama || "ini"} di Alkes PKY 👇`;

  document.getElementById("shareWA").href =
    `https://wa.me/?text=${encodeURIComponent(textProduk + " " + urlProduk)}`;

  document.getElementById("shareFB").href =
    `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(urlProduk)}`;

  document.getElementById("shareIG").onclick = () => {
    navigator.clipboard.writeText(urlProduk);
    alert("Link produk disalin! Tempelkan di Instagram Story atau DM 📋");
  };
}

function getKeyword(nama){
  return (nama || "")
    .toLowerCase()
    .split(" ")
    .filter(Boolean)[0] || "";
}

function shuffle(array){
  return array.sort(() => Math.random() - 0.5);
}

function renderRelated(produk){
  relatedBox.innerHTML = "";

  const keyword = getKeyword(produk.nama);

  let related = produkShopee.filter(p =>
    p.id !== produk.id &&
    (
      (p.nama || "").toLowerCase().includes(keyword) ||
      (p.keterangan || "").toLowerCase().includes(keyword)
    )
  );

  if(related.length === 0){
    related = shuffle(
      produkShopee.filter(p => p.id !== produk.id)
    );
  }

  related = related.slice(0, 5);

  related.forEach(p => {
    relatedBox.innerHTML += `
      <div class="product">
        <img src="${p.gambar || './logo.png'}" alt="${p.nama || 'Produk Alkes PKY'}">
        <div class="name">${p.nama || ""}</div>
        <div class="price">${p.harga || ""}</div>
        <a class="ask" href="detail.html?id=${p.id || ''}">
          Lihat Produk
        </a>
      </div>
    `;
  });
}

fetch(API_URL)
.then(res => res.json())
.then(data => {
  produkShopee = Array.isArray(data) ? data : [];

  const produk = produkShopee.find(p => String(p.id) === String(id));

  if(!produk){
    card.innerHTML = `
      <p style="text-align:center;color:#6b7280;margin-top:24px">
        Produk tidak ditemukan.
      </p>
      <a class="btn home" href="index.html">
        ← Kembali ke Home
      </a>
    `;
    relatedBox.innerHTML = "";
    return;
  }

  renderDetail(produk);
  renderRelated(produk);
})
.catch(err => {
  console.error(err);

  card.innerHTML = `
    <p style="text-align:center;color:#6b7280;margin-top:24px">
      Gagal memuat detail produk.
    </p>
    <a class="btn home" href="index.html">
      ← Kembali ke Home
    </a>
  `;
});
</script>

</body>
</html>
