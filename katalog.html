<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katalog Alkes PKY</title>
<link rel="icon" type="image/png" href="./logo.png">
<link rel="apple-touch-icon" href="./logo.png">
<meta name="theme-color" content="#76b8d6">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--blue:#76b8d6;--blue2:#5fa8ca;--text:#1f2937;--muted:#64748b;--line:#d7e8ef;--soft:#edf7fb}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef4f7;color:var(--text)}
.app{max-width:1120px;margin:auto;padding:16px}.panel{background:white;border-radius:20px;overflow:hidden;box-shadow:0 12px 35px rgba(15,23,42,.08);margin-bottom:18px}.no-print{padding:18px}
.toolbar{display:grid;grid-template-columns:1fr 220px 190px auto;gap:10px;align-items:center}.input,.select{width:100%;border:1px solid #dbe7ec;border-radius:14px;padding:12px 14px;font:inherit;outline:none}.btn{border:0;border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:900;font-family:inherit}.btn-primary{background:var(--blue2);color:white}.btn-soft{background:#eef7fb;color:#24556b}.setting-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}.check{display:inline-flex;gap:8px;align-items:center;border:1px solid #dbe7ec;border-radius:999px;padding:9px 12px;font-weight:800;font-size:13px;background:white}.check input{accent-color:var(--blue2)}.selector{display:none;border-top:1px solid #e5eef2;margin-top:16px;padding-top:16px}.selector.show{display:block}.selector-toolbar{display:grid;grid-template-columns:1fr 220px auto auto;gap:10px;margin-bottom:14px}.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-height:520px;overflow:auto}.product-card{border:1px solid #dbe7ec;border-radius:18px;padding:10px;background:white}.product-card.selected{border-color:var(--blue2);background:#f0f9fc}.product-card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;background:#f1f5f9}.product-card h4{margin:8px 0 4px;font-size:13px;line-height:1.25}.product-card .row{display:flex;justify-content:space-between;gap:8px}.product-card input{width:20px;height:20px;accent-color:var(--blue2)}.price-small{font-size:12px;font-weight:900;color:#397c98}
.catalog-sheet{position:relative;background:white;min-height:1480px;overflow:hidden;border-radius:8px}.sheet-inner{position:relative;z-index:2;padding:34px 42px 42px}.sheet-header{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:start}.sheet-logo{width:132px;height:132px;border-radius:50%;object-fit:cover;background:#5db4e4;box-shadow:0 6px 12px rgba(0,0,0,.22)}.brand-title{padding-top:8px}.brand-title h1{margin:0;color:#70b9dd;font-size:54px;line-height:1;letter-spacing:1px;font-weight:900;text-shadow:-1px -1px 0 #4da0c3,1px -1px 0 #4da0c3,-1px 1px 0 #4da0c3,1px 1px 0 #4da0c3}.brand-title p{margin:10px 0 12px;font-size:25px;letter-spacing:.2px}.catalog-pill{display:inline-block;background:#6b9fba;color:white;padding:9px 26px;border-radius:12px;font-size:34px;font-weight:900;line-height:1}.qr-row{display:flex;gap:14px;align-items:flex-start}.qr-box{width:152px;height:198px;border:3px solid #6b9fba;border-radius:28px;padding:9px;text-align:center;background:white}.qr-box img{width:126px;height:126px;object-fit:cover;border-radius:8px}.qr-box .qr-label{margin-top:6px;font-size:19px;font-weight:700;color:#4b5563;white-space:nowrap}.qr-box.ig img{border-radius:10px}.qr-box.ig .qr-label{color:#4aa6c1;font-weight:900;font-size:16px}.pattern{position:absolute;width:310px;height:310px;opacity:.28;z-index:1;background-image:radial-gradient(circle at 25px 25px,transparent 15px,#8bb4c4 16px,#8bb4c4 18px,transparent 19px),radial-gradient(circle at 75px 75px,transparent 18px,#8bb4c4 19px,#8bb4c4 21px,transparent 22px),linear-gradient(45deg,transparent 45%,#8bb4c4 45%,#8bb4c4 47%,transparent 47%);background-size:100px 100px}.pattern.left-mid{left:-140px;top:330px;transform:rotate(45deg)}.pattern.right-mid{right:-155px;top:500px;transform:rotate(45deg)}.pattern.left-bottom{left:-115px;bottom:50px;transform:rotate(45deg)}.pattern.right-bottom{right:-120px;bottom:35px;transform:rotate(45deg)}.products-area{margin-top:90px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.catalog-item{border:1px solid #e2edf2;border-radius:22px;background:rgba(255,255,255,.92);padding:12px;text-align:center;box-shadow:0 8px 18px rgba(15,23,42,.05);break-inside:avoid}.catalog-item img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:18px;background:#f1f5f9;border:1px solid #edf3f6}.catalog-item strong{display:block;margin-top:10px;font-size:15px;line-height:1.3}.catalog-item .price{display:inline-block;margin-top:8px;background:#6b9fba;color:white;padding:6px 11px;border-radius:999px;font-size:14px;font-weight:900}.empty{grid-column:1/-1;color:#94a3b8;border:1px dashed #cbd5e1;border-radius:18px;padding:28px;text-align:center;background:white}.status{font-size:13px;color:#64748b;margin-top:10px;font-weight:700}
@media(max-width:960px){.toolbar,.selector-toolbar{grid-template-columns:1fr}.product-grid{grid-template-columns:repeat(2,1fr)}.sheet-header{
    display:grid;
    grid-template-columns:26mm 1fr 70mm;
    gap:6mm;
    align-items:start;}.qr-row{justify-content:flex-start;flex-wrap:wrap}.products-area{grid-template-columns:repeat(2,1fr)!important}}
@media(max-width:560px){.app{padding:10px}.sheet-inner{padding:24px 18px}.sheet-logo{width:92px;height:92px}.brand-title h1{font-size:34px}.brand-title p{font-size:17px}.catalog-pill{font-size:22px}.products-area{grid-template-columns:1fr!important;margin-top:45px}.product-grid{grid-template-columns:1fr}}
@media print{@page{size:A4;margin:0}body{background:white}.no-print{display:none!important}.app{max-width:none;padding:0}.panel{margin:0;border-radius:0;box-shadow:none}.catalog-sheet{width:210mm;min-height:297mm;border-radius:0}.sheet-inner{padding:9mm 10mm}.sheet-logo{width:26mm;height:26mm}.brand-title h1{font-size:38px}.brand-title p{font-size:18px;margin:6px 0 8px}.catalog-pill{font-size:24px;padding:6px 18px;border-radius:8px}.qr-box{width:31mm;height:41mm;border-radius:7mm;padding:2mm}.qr-box img{width:25mm;height:25mm}.qr-box .qr-label{font-size:12px}.qr-box.ig .qr-label{font-size:10px}.products-area{margin-top:48mm;gap:4mm;grid-template-columns:repeat(4,1fr)!important}.catalog-item{padding:2.5mm;border-radius:5mm}.catalog-item img{border-radius:4mm}.catalog-item strong{font-size:10.5px}.catalog-item .price{font-size:9.5px;padding:3px 7px}.pattern{width:70mm;height:70mm}}
</style></head><body><div class="app">
<section class="panel no-print"><div class="toolbar"><input id="catalogTitle" class="input" value="Catalog 2026" placeholder="Judul katalog"><select id="quickCatalog" class="select" onchange="applyQuickCatalog()"><option value="">Pilih katalog cepat...</option><option value="tensimeter">Katalog Tensimeter</option><option value="termometer">Katalog Termometer</option><option value="lengkap">Katalog Lengkap</option><option value="nursing">Katalog Nursing Kit</option><option value="rawatluka">Katalog Rawat Luka</option></select><select id="layoutSelect" class="select" onchange="renderPreview()"><option value="4">Layout 4 kolom</option><option value="3">Layout 3 kolom</option><option value="2">Layout 2 kolom</option></select><button class="btn btn-primary" onclick="window.print()">Cetak / Simpan PDF</button></div><div class="setting-row"><label class="check"><input type="checkbox" id="showPrice" checked onchange="renderPreview()"> Tampilkan harga</label><label class="check"><input type="checkbox" id="onlyAvailable" checked onchange="renderProductSelector(); renderPreview()"> Hanya stok tersedia</label><button class="btn btn-soft" onclick="loadProducts()">Refresh Database</button><button class="btn btn-soft" onclick="toggleSelector()">Tampilkan Pilihan Barang</button><button class="btn btn-soft" onclick="selectAllVisible()">Pilih semua tampil</button><button class="btn btn-soft" onclick="clearAll()">Kosongkan</button></div><div class="status" id="statusText">Memuat produk dari database...</div><div class="selector" id="selectorBox"><div class="selector-toolbar"><input id="searchBox" class="input" placeholder="Cari nama produk..." oninput="renderProductSelector()"><select id="categoryFilter" class="select" onchange="renderProductSelector()"><option value="">Semua kategori</option></select><button class="btn btn-soft" onclick="selectAllVisible()">Pilih tampil</button><button class="btn btn-soft" onclick="toggleSelector()">Sembunyikan</button></div><div class="product-grid" id="productGrid"></div></div></section>
<section class="panel"><div class="catalog-sheet" id="catalogPreview"></div></section></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbz3XTARB3Vd1pANXA5MZ1KqbquHLRC4eO3K6uZENRxfjtvnE1Nb7gv0AHEkxqDxyejGtA/exec?action=produk_web";let allProducts=[],selected=new Set(),selectorOpen=false;const fallbackProducts=[{id:"tensi-omron",nama:"Tensimeter Digital Omron",harga:"Rp700.000",gambar:"",kategori:"Tensimeter",keterangan:"Tersedia"},{id:"termogun",nama:"Thermogun Digital",harga:"Rp85.000",gambar:"",kategori:"Termometer",keterangan:"Tersedia"},{id:"oksimeter",nama:"Pulse Oximeter",harga:"Rp95.000",gambar:"",kategori:"Monitor",keterangan:"Tersedia"}];
function normalizeProduct(raw,index){const nama=raw.nama||raw.Nama||raw.name||raw.Name||raw.produk||raw.Produk||"";const harga=raw.harga||raw.Harga||raw.price||raw.Price||"";const gambar=raw.gambar||raw.Gambar||raw.image||raw.Image||raw.foto||raw.Foto||raw.link_gambar||raw["Link Gambar"]||"";const kategori=raw.kategori||raw.Kategori||raw.category||raw.Category||raw.jenis||raw.Jenis||"Produk";const keterangan=raw.keterangan||raw.Keterangan||raw.status||raw.Status||raw.stok||raw.Stok||"";const id=raw.id||raw.ID||raw.slug||raw.Slug||makeId(nama||("produk-"+index));return{id,nama,harga,gambar,kategori,keterangan}}
function makeId(text){return String(text).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||Math.random().toString(36).slice(2)}function isAvailable(p){const text=String(p.keterangan||"").toLowerCase();if(!text)return true;return text.includes("tersedia")||text.includes("ready")||text.includes("ada")}
function imageFallback(img){img.onerror=null;img.src="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'><rect width='300' height='300' rx='28' fill='#f1f5f9'/><circle cx='150' cy='118' r='42' fill='#cbd5e1'/><path d='M70 230c18-52 52-78 80-78s62 26 80 78' fill='#cbd5e1'/><text x='150' y='270' text-anchor='middle' font-family='Arial' font-size='18' fill='#64748b'>Alkes PKY</text></svg>`)}
async function loadProducts(){const status=document.getElementById("statusText");status.textContent="Memuat produk dari database...";try{const res=await fetch(API_URL,{cache:"no-store"});const data=await res.json();const arr=Array.isArray(data)?data:Array.isArray(data.data)?data.data:Array.isArray(data.produk)?data.produk:Array.isArray(data.products)?data.products:[];if(!arr.length)throw new Error("Data kosong atau format JSON belum sesuai.");allProducts=arr.map(normalizeProduct).filter(p=>p.nama);status.textContent=`Berhasil memuat ${allProducts.length} produk dari database.`}catch(err){allProducts=fallbackProducts.map(normalizeProduct);status.textContent="Database belum terbaca. Sementara menampilkan contoh produk.";console.warn(err)}selected=new Set(allProducts.slice(0,12).map(p=>p.id));renderCategoryOptions();renderProductSelector();renderPreview()}
function renderCategoryOptions(){const select=document.getElementById("categoryFilter");const cats=[...new Set(allProducts.map(p=>p.kategori).filter(Boolean))].sort();select.innerHTML=`<option value="">Semua kategori</option>`+cats.map(c=>`<option value="${c}">${c}</option>`).join("")}function getVisibleProducts(){const q=document.getElementById("searchBox")?.value?.toLowerCase()||"";const cat=document.getElementById("categoryFilter")?.value||"";const onlyAvailable=document.getElementById("onlyAvailable").checked;return allProducts.filter(p=>(!q||p.nama.toLowerCase().includes(q))&&(!cat||p.kategori===cat)&&(!onlyAvailable||isAvailable(p)))}
function renderProductSelector(){const grid=document.getElementById("productGrid");const list=getVisibleProducts();if(!list.length){grid.innerHTML=`<div class="empty">Produk tidak ditemukan.</div>`;return}grid.innerHTML=list.map(p=>`<div class="product-card ${selected.has(p.id)?"selected":""}"><img src="${p.gambar||""}" alt="${p.nama}" onerror="imageFallback(this)"><div class="row"><span class="price-small">${p.harga||""}</span><input type="checkbox" ${selected.has(p.id)?"checked":""} onchange="toggleProduct('${p.id}', this.checked)"></div><h4>${p.nama}</h4></div>`).join("")}function toggleProduct(id,checked){checked?selected.add(id):selected.delete(id);renderProductSelector();renderPreview()}function toggleSelector(){selectorOpen=!selectorOpen;document.getElementById("selectorBox").classList.toggle("show",selectorOpen)}function selectAllVisible(){getVisibleProducts().forEach(p=>selected.add(p.id));renderProductSelector();renderPreview()}function clearAll(){selected.clear();renderProductSelector();renderPreview()}
function applyQuickCatalog(){const val=document.getElementById("quickCatalog").value;if(!val)return;const keywords={tensimeter:["tensi","tensimeter"],termometer:["termometer","thermogun","suhu"],lengkap:[""],nursing:["nursing","praktik","handscoon","sarung tangan","apron","clemek","stetoskop"],rawatluka:["alkohol","povidone","kasa","plester","luka","betadine"]};selected.clear();if(val==="lengkap"){allProducts.filter(p=>!document.getElementById("onlyAvailable").checked||isAvailable(p)).forEach(p=>selected.add(p.id))}else{allProducts.forEach(p=>{const name=p.nama.toLowerCase();if(keywords[val].some(k=>name.includes(k)))selected.add(p.id)})}document.getElementById("catalogTitle").value="Catalog 2026";renderProductSelector();renderPreview()}
function renderPreview(){const title=document.getElementById("catalogTitle").value||"Catalog 2026";const layout=document.getElementById("layoutSelect").value||"4";const showPrice=document.getElementById("showPrice").checked;const onlyAvailable=document.getElementById("onlyAvailable").checked;const items=allProducts.filter(p=>selected.has(p.id)&&(!onlyAvailable||isAvailable(p)));const listHtml=items.length?items.map(p=>`<div class="catalog-item"><img src="${p.gambar||""}" alt="${p.nama}" onerror="imageFallback(this)"><strong>${p.nama}</strong>${showPrice&&p.harga?`<div class="price">${p.harga}</div>`:""}</div>`).join(""):`<div class="empty">Belum ada barang dipilih.</div>`;document.getElementById("catalogPreview").innerHTML=`<div class="pattern left-mid"></div><div class="pattern right-mid"></div><div class="pattern left-bottom"></div><div class="pattern right-bottom"></div><div class="sheet-inner"><div class="sheet-header"><img class="sheet-logo" src="./logo.png" alt="Logo Alkes PKY" onerror="imageFallback(this)"><div class="brand-title"><h1>Alkes Pky</h1><p>Sahabat Kesehatan Anda</p><div class="catalog-pill">${title}</div></div><div class="qr-row"><div class="qr-box"><img src="./qr-wa.png" alt="QR WhatsApp" onerror="imageFallback(this)"><div class="qr-label">0822-5312-4745</div></div><div class="qr-box ig"><img src="./qr-instagram-alkes-pky.png" alt="QR Instagram" onerror="imageFallback(this)"><div class="qr-label">@ALKES_PKY</div></div></div></div><div class="products-area" style="grid-template-columns:repeat(${layout},1fr)">${listHtml}</div></div>`}
document.getElementById("catalogTitle").addEventListener("input",renderPreview);loadProducts();
</script></body></html>
